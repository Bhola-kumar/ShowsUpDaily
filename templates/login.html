{% extends "base.html" %}
{% block title %}Sign in · Daily Poster{% endblock %}
{% block body %}
<div style="max-width:340px;margin:12vh auto 0">
  <h1 style="margin-bottom:16px">Daily Poster</h1>
  <form method="post" class="card stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div><label for="password">Password</label>
      <input id="password" type="password" name="password" autofocus required></div>
    <button class="primary" type="submit" style="width:100%">Sign in</button>
  </form>
</div>
{% endblock %}
