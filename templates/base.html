<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Daily Poster{% endblock %}</title>
<style>
  :root {
    --bg: #f6f6f3; --card: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e4e4de;
    --accent: #1f6feb; --accent-ink: #ffffff; --ok: #1a7f37; --err: #c62828; --warn: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --card: #1b1b19; --ink: #ecebe6; --muted: #98978f; --line: #2c2c29;
            --accent: #5b9dff; --accent-ink: #0b1220; --ok: #4cc26b; --err: #ff7b72; --warn: #d4a72c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; }
  .stat .s { font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) { .stats { grid-template-columns: 1fr; } }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  input[type=text], input[type=time], input[type=password], input[type=file], select, textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit; }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .row > div { flex: 1 1 140px; }
  button, .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 9px 14px; border-radius: 8px; font: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; margin: 0; padding-bottom: 8px; }
  .check input { width: auto; }
  video { width: 100%; max-height: 420px; background: #000; border-radius: 10px; display: block; }
  .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; border: 1px solid var(--line); background: var(--card); }
  .flash.ok { border-color: var(--ok); } .flash.err { border-color: var(--err); }
  .muted { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: 0; }
  .ok { color: var(--ok); } .err { color: var(--err); } .warn { color: var(--warn); }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  details p { margin: 6px 0 0; white-space: pre-wrap; font-size: 13px; color: var(--muted); }
  .list-item { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .list-item:first-of-type { border-top: 0; }
  .actions { display: flex; gap: 8px; }
  form.inline { display: inline; }
  .stack > * + * { margin-top: 12px; }
</style>
</head>
<body>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
